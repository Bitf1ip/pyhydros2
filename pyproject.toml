[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhydros2"
dynamic = ["version"]
description = "Async Python client for the official HYDROS Public API (CoralVue)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "PyHydros2 Contributors" }
]
keywords = ["hydros", "pyhydros", "coralvue", "aquarium"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Framework :: AsyncIO"
]
dependencies = [
  "aiohttp>=3.9.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  # aioresponses 0.7.9 doesn't yet support aiohttp's newer ClientResponse
  # signature; cap aiohttp in the dev/test env until aioresponses catches up.
  "aioresponses>=0.7.6",
  "aiohttp<3.11"
]
demo = [
  "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pyhydros2.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
